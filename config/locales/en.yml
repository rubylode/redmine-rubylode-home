      welcome_page_column:
        label: "Column"
        hint: "Left or right. Where the open tickets go on the welcome page. The tiles stay in the left column."
        choices:
          left: "Left"
          right: "Right"
      dates_without_times:
        label: "Show dates without times in issue lists"
        hint: "Shows the date only, in each person's date format, in the created, updated and closed columns of the issue list and in the added and updated lines on an issue page."
    errors:
      welcome_page_content_invalid: "Welcome page content must be one of: %{choices}."
      welcome_page_column_invalid: "Column must be one of: %{choices}."
